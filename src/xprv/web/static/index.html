<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xprv.it</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  color-scheme:dark;
  /* ground: blue-black, never flat */
  --bg:#070b14;
  --bg-hi:#0d1526;
  --bg-lo:#04060c;
  --surface:#0b111c;
  --field:rgba(12,19,32,.78);
  --line:rgba(178,205,240,.12);
  --line-strong:rgba(198,224,255,.24);
  --line-soft:rgba(178,205,240,.07);
  --veil:rgba(7,11,20,.4);
  --scrim:rgba(3,6,12,.74);
  /* text */
  --text:#e6edf7;
  --text-2:#aeb9ca;
  --muted:#8592a7;
  --key:#8399bd;
  --faint:#3a4659;
  /* light: ice, with sky and violet as its family */
  --slate:#9aa6ba;
  --ice:#cfe5ff;
  --ice-hi:#e2f0ff;
  /* the heading and the field share one width */
  --pair:min(680px, calc(100vw - 2rem), 90vh);
  --ice-rgb:207,229,255;
  --sky:#8fb6ec;
  --sky-rgb:143,182,236;
  --violet:#ad9ff0;
  --violet-rgb:173,159,240;
  /* meaning */
  --ok:#9ddfcf;
  --ok-rgb:157,223,207;
  --danger:#f0a0ab;
  --danger-rgb:240,160,171;
  /* type: one sans, one mono */
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --input-font:var(--mono);
}
html{background:var(--bg)}
html,body{min-height:100vh;min-height:100dvh;height:100%;overflow:hidden;color:var(--text);
font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

canvas#globe{position:fixed;inset:0;z-index:0;pointer-events:none}

body{display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:2rem;position:relative;z-index:1;padding:2rem 1rem;
background:radial-gradient(ellipse 75% 65% at 50% 50%,var(--bg-hi) 0%,var(--bg) 62%,var(--bg-lo) 100%)}
/* the field is the only thing in flow, so it sits at the exact centre of the
   page (and of the globe); details and status hang below it */
.hero{
  width:var(--pair);
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  z-index:2;
  animation:hero-in .7s ease-out both;
}
.below{
  position:absolute;
  top:100%;
  left:0;
  right:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.75rem;
  padding-top:.9rem;
}
/* the page name stays for assistive tech; visually the field stands alone */
.title-wrap{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip-path:inset(50%);
  white-space:nowrap;
}

/* one field: one border, one radius, one background; controls sit inside */
.search-shell{width:100%}
.search{width:100%;position:relative}
input{
  width:100%;
  height:3.75rem;
  padding:0 4.75rem 0 1.15rem;
  font-family:var(--input-font);
  font-size:15px;
  color:var(--text);
  caret-color:var(--ice);
  background:var(--field);
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:border-color .2s, box-shadow .2s;
}
input:not(:placeholder-shown){padding-right:3.4rem}
input::placeholder{color:var(--muted);opacity:1}
input:hover{border-color:var(--line-strong)}
input:focus{border-color:rgba(var(--ice-rgb),.5);box-shadow:0 0 0 3px rgba(var(--ice-rgb),.07)}
input.valid{border-color:rgba(var(--ok-rgb),.55);box-shadow:0 0 0 3px rgba(var(--ok-rgb),.06)}
input.invalid{border-color:rgba(var(--danger-rgb),.6);box-shadow:0 0 0 3px rgba(var(--danger-rgb),.07)}
.clear,.paste{
  position:absolute;
  top:50%;
  right:.45rem;
  transform:translateY(-50%);
  height:2.75rem;
  display:none;
  align-items:center;
  justify-content:center;
  background:none;
  border:0;
  border-radius:8px;
  color:var(--muted);
  font-family:var(--input-font);
  cursor:pointer;
  transition:color .15s, background-color .15s;
}
.paste{padding:0 .8rem;font-size:12px;letter-spacing:.06em}
.clear{width:2.75rem}
.clear svg{width:13px;height:13px;display:block}
.clear:hover,.paste:hover{color:var(--ice);background:rgba(var(--ice-rgb),.06)}
input:not(:placeholder-shown) ~ .clear{display:flex}
input:placeholder-shown ~ .paste{display:flex}

.status{
  font-family:var(--sans);
  font-size:13px;
  line-height:1.4;
  color:var(--text-2);
  min-height:1.35em;
  text-align:center;
  padding:.35rem 1rem;
  border-radius:999px;
  max-width:100%;
  text-shadow:0 0 6px var(--bg);
}
.status:not(:empty){
  background:var(--veil);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.status.error{color:var(--danger)}
.status.working{color:var(--violet)}
.status.done{display:flex;gap:1.1rem;justify-content:center;font-family:var(--mono);font-size:12px}
.act{color:var(--text-2);text-decoration:none;background:none;border:0;padding:0;
font:inherit;cursor:pointer;border-radius:4px;transition:color .15s}
.act:hover{color:var(--ice)}
.act-primary{color:var(--ice)}
footer{
  position:fixed;
  bottom:1.1rem;
  font-family:var(--sans);
  font-size:12px;
  color:var(--muted);
  text-align:center;
  z-index:2;
  animation:hero-in .9s ease-out both;
}
footer a{color:var(--text-2);text-decoration:none}
footer a:hover{color:var(--ice)}
/* caption above the field: the domain read aloud. The slash is lit like the
   corner beams. "prove x/it" spans exactly the field's width, ink edge to ink
   edge: fitCaption() measures the face the browser actually resolved. These
   values are the fallback before it runs, worked out for Menlo:
   ink width = 10 advances + 9 trackings - bearing(p) - bearing(t)
             = (10*.6021 + 9*.12 - .0928 - .0981)em = 6.9101em, so
   font-size = pair width / 6.9101, and the negative side margins trim the
   bearings and the trailing tracking. */
.caption{
  align-self:center;
  width:max-content;
  margin:0 -.2181em max(.9rem,.22em) -.0928em;
  white-space:nowrap;
  font-family:var(--mono);
  font-size:calc(var(--pair) / 6.9101);
  font-weight:400;
  line-height:1.05;
  letter-spacing:.12em;
  color:var(--slate);
  text-shadow:0 0 14px var(--bg);
}
.caption .slash{
  color:var(--ice-hi);
  text-shadow:0 0 1px rgba(var(--ice-rgb),.75),0 0 10px rgba(var(--ice-rgb),.5),0 0 14px var(--bg);
}
:focus-visible{outline:1px solid rgba(var(--ice-rgb),.75);outline-offset:3px}
input:focus-visible{outline:none}
.clear:focus-visible,.paste:focus-visible,#modal-close:focus-visible{outline-offset:-1px}
.gh{border-radius:50%}
.gh svg{fill:var(--ice);display:block}
.gh:focus-visible{opacity:.9 !important}
.toast{position:fixed;bottom:3rem;left:50%;transform:translateX(-50%);z-index:20;
background:var(--surface);color:var(--ice);border:1px solid var(--line-strong);border-radius:8px;
padding:.45rem 1rem;font-family:var(--mono);font-size:12px;opacity:1;transition:opacity .3s}

#details{margin-top:.1rem;opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s;
font-family:var(--mono);font-size:12px;color:var(--text-2);text-shadow:0 0 6px var(--bg);
display:flex;align-items:center;gap:0;flex-wrap:wrap;justify-content:center;
background:var(--veil);border-radius:999px;padding:.3rem 1rem;
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:100%}
#details.show{opacity:1;transform:translateY(0);animation:details-in .35s ease-out}
#details:empty{display:none}
@keyframes details-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
#details .sep{color:var(--faint);margin:0 .7rem}
@media(max-width:500px){
  /* two rows on a phone, not a four-row column over the scrolling globe */
  #details{flex-wrap:wrap;column-gap:1.1rem;row-gap:0;padding:.15rem .9rem;border-radius:14px;background:var(--scrim)}
  #details .sep{display:none}
  input{height:3.5rem;font-size:16px;padding:0 4.2rem 0 1rem}
  input::placeholder{font-size:min(14px,3.6vw)}
  input:not(:placeholder-shown){padding-right:3.4rem}
  .paste{padding:0 .65rem}
}
#details a{color:var(--text);text-decoration:none;cursor:pointer}
#details a:hover{color:var(--ice)}
#details .steps{cursor:pointer;color:var(--ice);background:none;border:0;padding:0;font:inherit;border-radius:4px}
#details .steps:hover{text-decoration:underline;text-underline-offset:3px}
#details .icon{cursor:pointer;opacity:.5;margin-left:.3rem;font-size:.9em}
#details .icon:hover{opacity:1}

#modal{display:none;position:fixed;inset:0;z-index:10;
background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
align-items:center;justify-content:center;padding:2rem}
#modal.show{display:flex}
#modal-inner{background:var(--surface);border:1px solid var(--line);border-radius:14px;
width:min(1000px,92vw);height:85vh;height:85dvh;display:flex;flex-direction:column;
font-family:var(--mono);font-size:.8rem;line-height:1.6;color:var(--text-2);
position:relative;overflow:hidden;
box-shadow:0 40px 120px rgba(0,0,0,.5),inset 0 1px 0 rgba(var(--ice-rgb),.04)}
#modal-header{padding:1.05rem 3.75rem 1.05rem 1.75rem;border-bottom:1px solid var(--line);flex-shrink:0}
#modal-header h3{color:var(--text);font-family:var(--sans);font-size:.95rem;font-weight:500;letter-spacing:.005em;
margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;min-height:2.1rem}
.id-badges{margin-left:auto;display:inline-flex;align-items:center;font-family:var(--mono);font-weight:400;
letter-spacing:0;padding:.28rem .7rem;border:1px solid var(--line);border-radius:8px}
.id-badge{display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.id-val{font-size:.66rem;color:var(--text-2)}
.id-label{font-size:.55rem;letter-spacing:.06em;color:var(--muted)}
.id-badge.is-net .id-val{color:var(--ice)}
.id-dot{color:var(--faint);margin:0 .55rem;font-size:.7rem}
#modal-body{flex:1;overflow-y:auto;padding:1.4rem 1.75rem;
scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
#step-scene{position:relative;min-height:100%}
#step-content{position:relative;z-index:1}
#step-links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
#step-links-debug{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
#step-links .link-path{fill:none;stroke:rgba(var(--ice-rgb),.3);stroke-width:1.15;
stroke-dasharray:1.5 6.5;stroke-linecap:round;opacity:.92}
#step-links .link-path.even{stroke:rgba(var(--violet-rgb),.42)}
#step-links .link-path.animate-in{opacity:0;animation:link-path-in .7s cubic-bezier(.22,.7,.2,1) forwards}
#step-links-debug .link-debug-box{fill:none;stroke:rgba(255,0,200,.8);stroke-width:1;
stroke-dasharray:3 2}
#step-links-debug .link-debug-dot{fill:#00e5ff;stroke:rgba(0,0,0,.65);stroke-width:.8}
#step-links-debug .link-debug-edge{fill:#111;stroke:#ff5bd8;stroke-width:.9}
#modal-footer{padding:.75rem 1.75rem;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted);
flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:1.1rem}
#modal-footer:empty{display:none}
#modal-footer .msep{color:var(--faint)}
#modal-close{position:absolute;top:1.05rem;right:1rem;width:2.1rem;height:2.1rem;
display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;
background:none;border:0;border-radius:8px;z-index:1;transition:color .15s, background-color .15s}
#modal-close svg{width:14px;height:14px;display:block}
#modal-close:hover{color:var(--text);background:rgba(var(--ice-rgb),.06)}

/* proof steps: one family of cool tones; anchor ice, header sky, map violet */
.step-block{margin-bottom:1.15rem;padding:.5rem .5rem .55rem 1rem;border-left:2px solid var(--line)}
.step-block.anchor{border-color:rgba(var(--ice-rgb),.75)}
.step-block.header{border-color:rgba(var(--sky-rgb),.75)}
.step-block.map{border-color:rgba(var(--violet-rgb),.75);margin-left:.6rem}
.step-type{font-weight:600;margin-bottom:.35rem;font-size:.8rem;letter-spacing:.02em}
.step-type.anchor{color:var(--ice)}
.step-type.header{color:var(--sky)}
.step-type.map{color:var(--violet)}
.step-detail{color:var(--text-2);font-size:.75rem;line-height:1.85;overflow-wrap:anywhere}
.step-detail .k{color:var(--key)}
.step-detail .v{color:var(--text)}
.step-detail .h{color:var(--muted);font-size:.7rem}
.step-detail .n{color:var(--text);font-variant-numeric:tabular-nums}
.step-detail .sep{color:var(--faint);margin:0 .25rem}
.step-detail .link-badge{display:inline-flex;align-items:center;justify-content:center;
width:1.6em;height:1.6em;font-size:.8em;font-weight:700;color:var(--bg);background:var(--ice);
border:1px solid var(--ice);border-radius:50%;margin-right:.35rem;vertical-align:middle}
.step-detail .link-badge.is-inverted{color:var(--ice);background:transparent;border-color:rgba(var(--ice-rgb),.5)}
.debug-step-links .step-detail .link-badge{box-shadow:0 0 0 1px rgba(255,0,200,.82),0 0 0 4px rgba(255,0,200,.08)}
.debug-step-links #step-scene{box-shadow:inset 0 0 0 1px rgba(255,0,200,.12)}
.debug-step-links #step-content{box-shadow:inset 0 0 0 1px rgba(0,229,255,.1)}
.step-detail .link-anchor{color:var(--ice);font-weight:600}
.step-detail .link-tx{color:var(--violet)}
.step-detail .link-state{color:var(--sky)}
.step-detail .leaf-data{margin-top:.45rem;padding:.4rem .8rem;
border-left:1px solid var(--line-strong);margin-left:.2rem;background:rgba(var(--ice-rgb),.025);border-radius:0 8px 8px 0}
.step-detail .leaf-ellipsis{display:block;color:var(--muted);font-size:.66rem;letter-spacing:.18em}
.step-detail .ok-mark{color:var(--ok);font-size:.85em;margin-right:.3rem}

.step-skeleton{margin-bottom:1.15rem;padding:.5rem .5rem .55rem 1rem;border-left:2px solid var(--line);
animation:sk-pulse 1.6s ease-in-out infinite}
.step-skeleton .sk-label{font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:.55rem}
#sk-elapsed{font-weight:400;color:var(--muted);font-size:.7rem;margin-left:.2rem}
.step-skeleton .sk-bar{height:.5rem;border-radius:4px;background:rgba(var(--ice-rgb),.06);margin-bottom:.45rem}
.step-skeleton .sk-bar:nth-child(2){width:70%}
.step-skeleton .sk-bar:nth-child(3){width:50%}
.log-console{font-size:.66rem;color:var(--muted);margin:.3rem 0 .6rem;padding:.3rem .75rem;
border-left:1px solid var(--line);max-height:5.5em;overflow-y:auto;overflow-x:hidden}
.modal-error{margin-top:1rem;padding:.55rem .9rem;border-left:2px solid var(--danger);color:var(--danger);
font-size:.8rem;display:flex;align-items:center;gap:1rem}
.modal-error .msg{flex:1;min-width:0;overflow-wrap:anywhere}
.retry{background:none;border:1px solid var(--line-strong);color:var(--text);padding:.35rem .95rem;
border-radius:8px;cursor:pointer;font:inherit;font-size:.75rem;white-space:nowrap;transition:border-color .15s, color .15s}
.retry:hover{border-color:rgba(var(--ice-rgb),.55);color:var(--ice)}
@keyframes sk-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes link-path-in{
  from{opacity:0;stroke-dashoffset:14}
  to{opacity:.92;stroke-dashoffset:0}
}
@keyframes hero-in{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}

.step-block{position:relative}
.step-time{position:absolute;top:.5rem;right:.25rem;font-size:.66rem;color:var(--muted);font-family:var(--mono)}

/* mobile modal: after the base modal rules so it wins the cascade */
@media(max-width:500px){
  #modal{padding:.6rem}
  #modal-inner{width:100%;height:100%;border-radius:12px}
  #modal-header{padding:.85rem 1rem}
  #modal-header h3{flex-direction:column;align-items:flex-start;gap:.55rem}
  .id-badges{margin-left:0;max-width:100%;padding:.28rem .6rem;flex-wrap:wrap;row-gap:.2rem}
  .id-dot{margin:0 .3rem}
  .id-val{white-space:nowrap}
  #modal-close{top:.6rem;right:.4rem}
  #modal-body{padding:1rem 1rem 1.25rem}
  #modal-footer{padding:0 .5rem;gap:.25rem}
  .status.done{padding:0 .4rem;gap:.25rem}
  .step-block{padding-left:.8rem}
  .step-block.map{margin-left:.35rem}
  .step-detail .leaf-data{padding:.4rem .6rem}
}
/* every tap target at least 28px; 44px wherever the pointer is a finger */
.act,#details a,#details .steps{display:inline-flex;align-items:center;min-height:28px}
#modal-footer .act,.status.done .act{padding:0 .35rem}
footer a{display:inline-block;padding:8px 4px;margin:-8px -4px}
.gh{padding:8px;margin:-8px}
@media(max-width:500px),(pointer:coarse),(max-height:500px){
  input{font-size:16px}
  .act,#details a,#details .steps{min-height:44px;min-width:44px;justify-content:center}
  #modal-footer .act,.status.done .act{padding:0 .6rem}
  #modal-close{width:2.75rem;height:2.75rem}
  .retry{min-height:44px;padding:0 1.1rem}
  footer a{padding:15px 6px;margin:-15px -6px}
}
/* phone landscape: lift the group so the done state clears the footer */
@media(max-height:500px){
  body{justify-content:flex-start;padding-top:max(1rem,calc(50vh - 7.5rem));
  padding-top:max(1rem,calc(50dvh - 7.5rem))}
  .below{padding-top:.6rem;gap:.5rem}
  #details{padding-top:0;padding-bottom:0}
  #modal{padding:.5rem}
  #modal-inner{height:100%}
  #modal-header{padding-top:.55rem;padding-bottom:.55rem}
  footer{bottom:.5rem}
}
</style>
</head>
<body>
<svg id="corner-lines" style="position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none">
<defs>
<linearGradient id="tl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" style="stop-color:var(--ice-hi)" stop-opacity=".9"/><stop offset="60%" style="stop-color:var(--ice)" stop-opacity=".3"/><stop offset="100%" style="stop-color:var(--violet)" stop-opacity="0"/></linearGradient>
<linearGradient id="tr" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" style="stop-color:var(--ice-hi)" stop-opacity=".7"/><stop offset="60%" style="stop-color:var(--ice)" stop-opacity=".22"/><stop offset="100%" style="stop-color:var(--violet)" stop-opacity="0"/></linearGradient>
<linearGradient id="bl" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" style="stop-color:var(--ice-hi)" stop-opacity=".7"/><stop offset="60%" style="stop-color:var(--ice)" stop-opacity=".22"/><stop offset="100%" style="stop-color:var(--violet)" stop-opacity="0"/></linearGradient>
<linearGradient id="br" x1="1" y1="1" x2="0" y2="0"><stop offset="0%" style="stop-color:var(--ice-hi)" stop-opacity=".9"/><stop offset="60%" style="stop-color:var(--ice)" stop-opacity=".3"/><stop offset="100%" style="stop-color:var(--violet)" stop-opacity="0"/></linearGradient>
<filter id="glo" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<line x1="0" y1="0" x2="14%" y2="14%" stroke="url(#tl)" stroke-width="1.4" filter="url(#glo)"/>
<line x1="100%" y1="0" x2="89%" y2="11%" stroke="url(#tr)" stroke-width="1.4" filter="url(#glo)" display="none"/>
<line x1="0" y1="100%" x2="11%" y2="89%" stroke="url(#bl)" stroke-width="1.4" filter="url(#glo)"/>

<script>
const tx = document.getElementById('tx');
const statusEl = document.getElementById('status');
const details = document.getElementById('details');
const canvas = document.getElementById('globe');
const ctx = canvas.getContext('2d');
const HEX64 = /^[0-9a-fA-F]{64}$/;
const HEX_ONLY = /^[0-9a-fA-F]*$/;
let controller = null;
let mouseX = 0.5, mouseY = 0.5;

// ── Heading fit ───────────────────────────────────────────────
// "prove x/it" spans the field exactly, ink edge to ink edge. The monospace
// face differs by platform (SF Mono, Menlo, Consolas, DejaVu Sans Mono...),
// so measure the one the browser resolved: lay the caption out at a probe
// size, find where the first and last glyphs' ink starts and ends, then scale
// so that ink width equals the field width, and trim the overhang with
// negative margins. The CSS fallback is the same fit, worked out for Menlo.
const caption = document.querySelector('.caption');
const captionField = document.querySelector('.search-shell');

// Where a glyph's ink starts and ends, relative to its origin, found by
// drawing it and scanning the pixels. Canvas actualBoundingBox metrics would
// be simpler, but WebKit reports them wider than the ink.
function glyphInk(font, ch, size) {
  const c = document.createElement('canvas');
  c.width = size * 3;
  c.height = size * 2;
  const g = c.getContext('2d', {willReadFrequently: true});
  g.font = font;
  g.textBaseline = 'middle';
  g.fillText(ch, size, size);
  const {data} = g.getImageData(0, 0, c.width, c.height);
  let min = Infinity, max = -Infinity;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      if (data[(y * c.width + x) * 4 + 3] >= 128) {
        if (x < min) min = x;
        if (x > max) max = x;
      }
    }
  }
  return min > max ? null : {left: min - size, right: max + 1 - size};
}

// The fit is decoration. If it can't measure (a browser may refuse canvas
// pixel reads), the heading falls back to its CSS sizing, and nothing stops
// the rest of the page from starting.
function fitCaption() {
  if (!caption || !captionField) return;
  let fitted = false;
  try {
    fitted = fitCaptionToField();
  } catch (e) {
    fitted = false;
  }
  if (fitted === false)
    caption.style.fontSize = caption.style.marginLeft = caption.style.marginRight = '';
}

// Returns true when fitted, false when it measured nothing usable, and
// undefined when there is nothing to fit yet (zero width): styles are kept.
function fitCaptionToField() {
  const target = captionField.getBoundingClientRect().width;
  const text = caption.textContent;
  if (!target || !text) return undefined;
  const probe = 100;
  caption.style.fontSize = `${probe}px`;
  caption.style.marginLeft = caption.style.marginRight = '0px';

  const style = getComputedStyle(caption);
  const font = `${style.fontStyle} ${style.fontWeight} ${probe}px ${style.fontFamily}`;
  const first = glyphInk(font, text[0], probe);
  const last = glyphInk(font, text[text.length - 1], probe);
  if (!first || !last) return false;

  // Glyph origins of the first and last characters, from their own boxes,
  // so trailing letter-spacing can't skew the result.
  const nodes = [];
  const walker = document.createTreeWalker(caption, NodeFilter.SHOW_TEXT);
  while (walker.nextNode()) if (walker.currentNode.length) nodes.push(walker.currentNode);
  const charLeft = (node, i) => {
    const r = document.createRange();
    r.setStart(node, i);
    r.setEnd(node, i + 1);
    return r.getBoundingClientRect().left;
  };
  const tail = nodes[nodes.length - 1];
  const box = caption.getBoundingClientRect();
  const inkLeft = charLeft(nodes[0], 0) + first.left;
  const inkRight = charLeft(tail, tail.length - 1) + last.right;
  const ink = inkRight - inkLeft;
  if (!(ink > 0)) return false;

  const k = target / ink;
  caption.style.fontSize = `${probe * k}px`;
  caption.style.marginLeft = `${-(inkLeft - box.left) * k}px`;
  caption.style.marginRight = `${-(box.right - inkRight) * k}px`;
  return true;
}

fitCaption();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCaption);
if (window.ResizeObserver && captionField) new ResizeObserver(fitCaption).observe(captionField);

// ── Globe JSON background ─────────────────────────────────────
let rotation = 0;
let charGrid = []; // [{ch, isKey}] per line
let globeDirty = true; // content or size changed since the last draw

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  globeDirty = true;
}
resize();
window.addEventListener('resize', resize);
// Smooth mouse tracking — lerp toward target to avoid glitchy snaps
let targetX = 0.5, targetY = 0.5;
document.addEventListener('mousemove', e => {
  targetX = e.clientX / window.innerWidth;
  targetY = e.clientY / window.innerHeight;
});

// Idle globe: the proof format with placeholder values (never proof data),
// drawn dimmer until a real proof replaces it at full intensity.
const PROOF_HEADER_FORMAT = {
  ledger_index: '<uint32>', total_coins: '<uint64>', parent_hash: '<hash256>',
  transaction_hash: '<hash256>', account_hash: '<hash256>', parent_close_time: '<uint32>',
  close_time: '<uint32>', close_time_resolution: '<uint8>', close_flags: '<uint8>'
};
const PROOF_FORMAT = JSON.stringify({
  network_id: '<uint32>',
  steps: [
    {type: 'anchor', ledger_hash: '<hash256>', ledger_index: '<uint32>',
     unl: {public_key: '<hex>', manifest: '<hex>', blob: '<hex>', signature: '<hex>'},
     validations: {'<validator public_key>': '<hex>', '…': '<hex>'},
     summary: {total_validations: '<uint32>'}},
    {type: 'ledger_header', header: PROOF_HEADER_FORMAT},
    {type: 'map_proof', tree: 'state',
     trie: {'<nibble>': {'<nibble>': ['<hash256>', {LedgerEntryType: 'LedgerHashes', Hashes: ['<hash256>', '…']}], '…': '<hash256>'}}},
    {type: 'ledger_header', header: PROOF_HEADER_FORMAT},
    {type: 'map_proof', tree: 'tx',
     trie: {'<nibble>': ['<hash256>', {tx: {hash: '<hash256>', TransactionType: '<string>'}, meta: {TransactionResult: '<string>'}}], '…': '<hash256>'}}
  ]
}, null, 2);
let globeIntensity = 1;

function populateGlobe(jsonStr, intensity = 1) {
  globeIntensity = intensity;
  globeDirty = true;
  const lines = jsonStr.split('\n').filter(l => l.trim());
  charGrid = lines.map(line => {
    const chars = [];
    const keyRe = /"([^"]+)"\s*:/g;
    const keyRanges = [];
    let m;
    while ((m = keyRe.exec(line)) !== null) {
      keyRanges.push([m.index + 1, m.index + 1 + m[1].length]);
    }
    for (let i = 0; i < line.length; i++) {
      const isKey = keyRanges.some(([s, e]) => i >= s && i < e);
      chars.push({ ch: line[i], isKey });
    }
    return chars;
  });
}

// The globe draws thousands of characters a frame, so canvas state is set
// only when it changes: font strings are cached by size, colour strings by
// colour and 8-bit alpha (the canvas keeps 8 bits of alpha anyway), and
// textAlign/textBaseline are set once per frame.
const GLOBE_FONT = 'ui-monospace,Menlo,Consolas,monospace';
const globeFonts = new Map();
const globeColours = new Map();
let globeFont = '', globeColour = '';

function setGlobeFont(bold, size) {
  const key = bold ? -size : size;
  let font = globeFonts.get(key);
  if (!font) globeFonts.set(key, font = `${bold ? 'bold ' : ''}${size}px ${GLOBE_FONT}`);
  if (font !== globeFont) ctx.font = globeFont = font;
}

function setGlobeColour(rgb, alpha) {
  const a = Math.max(0, Math.min(255, Math.round(alpha * 255)));
  const key = `${rgb},${a}`;
  let colour = globeColours.get(key);
  if (!colour) {
    if (globeColours.size > 8192) globeColours.clear();
    globeColours.set(key, colour = `rgba(${rgb},${a / 255})`);
  }
  if (colour !== globeColour) ctx.fillStyle = globeColour = colour;
}

// Motion runs on time at the 60 Hz pace it was designed at (one step per
// 1/60 s), and the globe redraws on every frame the display offers. With
// prefers-reduced-motion it holds still: no rotation, no pointer follow, and
// a redraw only when its content or size changes, or the preference does.
let lastGlobeFrame = 0;
const reducedMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
if (reducedMotion) {
  const onMotionPreference = () => { globeDirty = true; lastGlobeFrame = 0; };
  if (reducedMotion.addEventListener) reducedMotion.addEventListener('change', onMotionPreference);
  else if (reducedMotion.addListener) reducedMotion.addListener(onMotionPreference);
}

function drawGlobe(now) {
  requestAnimationFrame(drawGlobe);
  now = now || performance.now();
  const still = !!(reducedMotion && reducedMotion.matches);
  // A frame's timestamp is when the frame began, which can be a little
  // before the previous call's own clock read; never step backwards.
  const step = still ? 0
    : lastGlobeFrame ? Math.max(0, Math.min(now - lastGlobeFrame, 100)) / (1000 / 60) : 1;
  lastGlobeFrame = now;
  if (still && !globeDirty) return;
  globeDirty = false;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!charGrid.length) return;
  // clearRect resets nothing, but a canvas resize does: start each frame
  // from known state.
  globeFont = globeColour = '';

  // Smooth lerp toward mouse target (0.03 per 1/60 s = slow drift, avoids snap on flyover)
  const follow = 1 - Math.pow(0.97, step);
  mouseX += (targetX - mouseX) * follow;
  mouseY += (targetY - mouseY) * follow;

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const mobile = window.innerWidth < 600;

  if (mobile) {
    // Mobile: slow scrolling JSON text, filling screen width
    const w = canvas.width, h = canvas.height;
    const totalLines = charGrid.length;
    const sz = 11; // CSS pixels — canvas handles DPR via resize()
    const lineH = 15;
    const scrollY = rotation * 150;

    // Measure actual char width
    setGlobeFont(false, sz);
    const charW = ctx.measureText('M').width;
    const charsPerRow = Math.floor(w / charW);

    // Build wrapped rows from charGrid
    const visRows = Math.ceil(h / lineH) + 4;
    const startRow = Math.floor(scrollY / lineH);
    const yOffset = -(scrollY % lineH);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    for (let row = 0; row < visRows; row++) {
      // Cycle through charGrid, wrapping long lines across multiple rows
      const srcLine = (startRow + row) % totalLines;
      const parsed = charGrid[srcLine];
      if (!parsed.length) continue;

      const y = row * lineH + yOffset;
      const edgeFade = Math.min(Math.max(y, 0) / (lineH * 4), Math.max(h - y, 0) / (lineH * 4), 1);
      if (edgeFade <= 0) continue;

      for (let j = 0; j < charsPerRow && j < parsed.length; j++) {
        const { ch, isKey } = parsed[j];
        if (isKey) {
          setGlobeFont(true, sz);
          setGlobeColour('207,229,255', 0.14 * edgeFade * globeIntensity);
        } else {
          setGlobeFont(false, sz);
          setGlobeColour('150,158,240', 0.075 * edgeFade * globeIntensity);
        }
        ctx.fillText(ch, j * charW, y);
      }
    }
    rotation += 0.001 * step;
    return;
  }

  // Desktop: 3D globe — font sizes scale with viewport
  const vw = window.innerWidth;
  const baseKey = Math.max(8, vw * 0.007);    // ~9px at 1280, ~11px at 1600
  const baseVal = Math.max(6, vw * 0.005);    // ~6px at 1280, ~8px at 1600
  const r = Math.min(cx, cy) * 0.85;
  const tiltX = (mouseY - 0.5) * 0.5;
  const tiltY = (mouseX - 0.5) * 0.7;
  const cosX = Math.cos(tiltX), sinX = Math.sin(tiltX);
  const cosY = Math.cos(tiltY), sinY = Math.sin(tiltY);

  const totalLines = charGrid.length;
  const latLines = Math.min(totalLines, 80);
  const latSpread = 0.9;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (let i = 0; i < latLines; i++) {
    const lineIdx = i % totalLines;
    const parsed = charGrid[lineIdx];
    if (!parsed.length) continue;

    const ring = i % 2 === 0 ? i / 2 : -(i + 1) / 2;
    const lat = (ring / latLines) * Math.PI * latSpread;
    const cosLat = Math.cos(lat);
    const sinLat = Math.sin(lat);

    const charsToShow = Math.min(parsed.length, 100);
    for (let j = 0; j < charsToShow; j++) {
      const lon = -(j / charsToShow) * Math.PI * 2 + rotation + i * 0.03;

      let x = cosLat * Math.cos(lon);
      let z = cosLat * Math.sin(lon);
      let y = sinLat;

      const y2 = y * cosX - z * sinX;
      const z2 = y * sinX + z * cosX;
      const x2 = x * cosY - z2 * sinY;
      const z3 = x * sinY + z2 * cosY;

      if (z3 < -0.05) continue;

      const scale = 1 / (1 + z3 * 0.3);
      const sx = cx + x2 * r * scale;
      const sy = cy + y2 * r * scale;
      const depth = (z3 + 1) / 2;

      const { ch, isKey } = parsed[j];

      if (isKey) {
        const alpha = (0.12 + depth * depth * 0.5) * globeIntensity;
        setGlobeFont(true, Math.round((baseKey + depth * 4) * scale));
        setGlobeColour('207,229,255', alpha);
      } else {
        const alpha = (0.03 + depth * depth * 0.18) * globeIntensity;
        const lift = Math.floor(depth * 45);
        setGlobeFont(false, Math.round((baseVal + depth * 2) * scale));
        setGlobeColour(`${125 + lift},${135 + lift},${225 + Math.floor(depth * 25)}`, alpha);
      }

      ctx.fillText(ch, sx, sy);
    }
  }

  rotation += 0.002 * step;
}
populateGlobe(PROOF_FORMAT, 0.45);
drawGlobe();

// ── Proof logic ───────────────────────────────────────────────

function normalizeTxCandidate(raw, { extract = false } = {}) {
  const compact = raw.trim().replace(/\s+/g, '').replace(/^0x/i, '');
  if (!extract) return compact;
  const match = compact.match(/[0-9a-fA-F]{64}/);
  return match ? match[0] : compact;
}

function networkSlugForId(networkId) {
  const n = Number(networkId);
  if (!Number.isFinite(n)) return null;
  if (n === 0) return 'xrpl-mainnet';
  if (n === 21337) return 'xahau-mainnet';
  return String(n);
}

function networkLabel(networkId) {
  const n = Number(networkId);
  if (n === 0) return 'XRPL mainnet';
  if (n === 21337) return 'Xahau mainnet';
  return `network ${n}`;
}

function explorerUrlsForNetwork(networkId) {
  const n = Number(networkId);
  if (n === 0) {
    return {
      ledger: 'https://xrpscan.com/ledger/',
      tx: 'https://xrpscan.com/tx/'
    };
  }
  if (n === 21337) {
    return {
      ledger: 'https://xahscan.com/ledger/',
      tx: 'https://xahscan.com/tx/'
    };
  }
  return null;
}

function parseProofPath(pathname = location.pathname) {
  const match = pathname.match(/^\/network\/([^/]+)\/tx\/([0-9a-fA-F]{64})\/?$/);
  if (!match) return null;
  return {
    network: decodeURIComponent(match[1]).toLowerCase(),
    txHash: match[2].toUpperCase()
  };
}

function proofPathFor(hash, networkId) {
  const slug = networkSlugForId(networkId);
  return slug ? `/network/${slug}/tx/${hash.toUpperCase()}` : null;
}

function syncProofPath(hash, networkId, mode = 'push') {
  const path = proofPathFor(hash, networkId);
  if (!path || location.pathname === path) return;
  history[mode === 'replace' ? 'replaceState' : 'pushState'](
    { txHash: hash.toUpperCase(), networkId },
    '',
    path
  );
}

function clearProofPath(mode = 'replace') {
  if (location.pathname === '/') return;
  history[mode === 'replace' ? 'replaceState' : 'pushState']({}, '', '/');
}

async function doPaste() {
  try {
    const clip = await navigator.clipboard.readText();
    if (clip) {
      tx.value = normalizeTxCandidate(clip, { extract: true });
      tx.dispatchEvent(new Event('input'));
    }
  } catch(e) {}
}

tx.addEventListener('paste', (e) => {
  const clip = e.clipboardData?.getData('text');
  if (!clip) return;
  e.preventDefault();
  tx.value = normalizeTxCandidate(clip, { extract: true });
  tx.dispatchEvent(new Event('input'));
});

function resetProofUi() {
  tx.classList.remove('valid', 'invalid');
  statusEl.className = 'status';
  statusEl.textContent = '';
  details.className = '';
  details.innerHTML = '';
}

function handleTxInput({ history = 'push' } = {}) {
  const raw = tx.value.trim();
  const v = normalizeTxCandidate(raw);
  if (v !== raw) tx.value = v;

  resetProofUi();
  if (!v) {
    cancelActiveProof();
    clearStepScene();
    closeModal();
    if (history !== 'none')
      clearProofPath('replace');
    return;
  }
  if (!HEX_ONLY.test(v)) {
    cancelActiveProof();
    clearStepScene();
    closeModal();
    tx.classList.add('invalid');
    statusEl.classList.add('error');
    statusEl.textContent = 'hex only: 0-9, a-f';
    if (history !== 'none')
      clearProofPath('replace');
    return;
  }
  if (v.length < 64) {
    cancelActiveProof();
    clearStepScene();
    closeModal();
    statusEl.textContent = `${v.length}/64 characters`;
    if (history !== 'none' && parseProofPath())
      clearProofPath('replace');
    return;
  }
  if (v.length > 64) {
    cancelActiveProof();
    clearStepScene();
    closeModal();
    tx.classList.add('invalid');
    statusEl.classList.add('error');
    statusEl.textContent = 'too long for transaction hash';
    if (history !== 'none')
      clearProofPath('replace');
    return;
  }
  if (!HEX64.test(v)) return;

  const hash = v.toUpperCase();
  if (hash !== v) tx.value = hash;
  tx.classList.add('valid');
  const currentRoute = history !== 'none' ? parseProofPath() : null;
  if (currentRoute && currentRoute.txHash !== hash)
    clearProofPath('replace');
  prove(hash, {history});
}

tx.addEventListener('input', () => handleTxInput());

const S = '<span class="sep">|</span>';
let lastProofJson = null;
let lastProofPretty = '';
let lastDownloadUrl = '';
let lastFilename = '';
let lastProvedHash = '';
let lastRid = '';
let serverInfo = {};  // {run_id, build_id} from /health

// Fetch server identity once (lazy, on first prove)
async function fetchServerInfo() {
  if (serverInfo.run_id) return;
  try {
    const r = await fetch('/health');
    const xprv = new URLSearchParams(r.headers.get('X-XPRV') || '');
    serverInfo.format_version = xprv.get('format_version') || '';
    serverInfo.build_id = xprv.get('build_id') || '';
    serverInfo.run_id = xprv.get('run_id') || '';
    // Update footer verify link with version
    if (serverInfo.format_version) {
      document.querySelectorAll('a[href="/verify-xprv.py"]').forEach(a => {
        a.href = '/verify-xprv.py?v=' + serverInfo.format_version;
      });
    }
  } catch(e) {}
}
// Fetch server info on page load (for footer link versioning)
fetchServerInfo();

function idBadges(rid, networkId) {
  const items = [];
  if (serverInfo.build_id) items.push({label:'build', id:serverInfo.build_id});
  if (serverInfo.run_id) items.push({label:'run', id:serverInfo.run_id});
  if (rid) items.push({label:'req', id:rid});
  if (networkId !== undefined) items.push({label:'network', id:networkLabel(networkId), bright:true});
  if (!items.length) return '';
  const pill = items.map(i =>
    `<span class="id-badge${i.bright ? ' is-net' : ''}">` +
    `<span class="id-val">${i.id}</span>` +
    `<span class="id-label">${i.label}</span></span>`
  ).join('<span class="id-dot">\u00b7</span>');
  return `<span class="id-badges">${pill}</span>`;
}

function showDetails(json, txHash) {
  lastProofJson = json;
  lastProofPretty = JSON.stringify(json, null, 2);
  const steps = json.steps || [];
  const anchor = steps.find(s => s.type === 'anchor');

  const net = networkLabel(json.network_id);
  const explorer = explorerUrlsForNetwork(json.network_id);
  const seq = anchor
    ? (explorer
      ? (explorer.ledger
        ? `<a href="${explorer.ledger}${anchor.ledger_index}" target="_blank" rel="noopener">#${anchor.ledger_index}</a>`
        : `#${anchor.ledger_index}`)
      : `#${anchor.ledger_index}`)
    : '';
  const tx = explorer
    ? (explorer.tx
      ? `<a href="${explorer.tx}${txHash}" target="_blank" rel="noopener">${txHash.substring(0,16)}\u2026</a>`
      : `${txHash.substring(0,16)}\u2026`)
    : `${txHash.substring(0,16)}\u2026`;
  const stepsLink = `<button type="button" class="steps" onclick="showSteps()">${steps.length} steps</button>`;

  details.innerHTML = `${net}${S}${seq}${S}${tx}${S}${stepsLink}`;
  details.className = 'show';
}

// ── Ledger header hashing (SHA512-Half) ───────────────────────
async function hashHeader(hdr) {
  // prefix "LWR\0" + ledger_index(4) + total_coins(8) + 3×hash(32)
  //        + parent_close_time(4) + close_time(4) + resolution(1) + flags(1)
  const prefix = new Uint8Array([0x4C, 0x57, 0x52, 0x00]);
  const full = new Uint8Array(4 + 4 + 8 + 32 + 32 + 32 + 4 + 4 + 1 + 1);
  full.set(prefix, 0);

  const dv = new DataView(full.buffer);
  let off = 4;
  dv.setUint32(off, hdr.ledger_index); off += 4;
  // total_coins as uint64
  dv.setBigUint64(off, BigInt(hdr.total_coins)); off += 8;
  // 32-byte hashes
  for (const field of ['parent_hash', 'transaction_hash', 'account_hash']) {
    const bytes = hexToBytes(hdr[field]);
    full.set(bytes, off); off += 32;
  }
  dv.setUint32(off, hdr.parent_close_time); off += 4;
  dv.setUint32(off, hdr.close_time); off += 4;
  full[off++] = hdr.close_time_resolution;
  full[off++] = hdr.close_flags;

  const digest = await crypto.subtle.digest('SHA-512', full.slice(0, off));
  // SHA512-Half: first 32 bytes
  return bytesToHex(new Uint8Array(digest).slice(0, 32)).toUpperCase();
}

function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2)
    bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
  return bytes;
}

function bytesToHex(bytes) {
  return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
}

const RIPPLE_EPOCH = 946684800;
// Short skip list key: SHA512Half(be16(0x73)) — precomputed
// Same as xprv::skip_list_key() in C++
let SHORT_SKIP_KEY = '';
(async () => {
  const buf = new Uint8Array([0x00, 0x73]);
  const digest = await crypto.subtle.digest('SHA-512', buf);
  SHORT_SKIP_KEY = bytesToHex(new Uint8Array(digest).slice(0, 32)).toUpperCase();
})();
const rippleTime = (t) => {
  if (!t) return '';
  const d = new Date((t + RIPPLE_EPOCH) * 1000);
  const s = d.toISOString().replace('T',' ').replace(/:\d{2}\.\d+Z/,' UTC');
  return `<span class="h">${s}</span>`;
};
const kv = (k, v) => `<span class="k">${k}:</span> <span class="v">${v}</span>`;
const hx = (v, n=20) => `<span class="h">${v.substring(0, n)}\u2026</span>`;
const num = (v) => `<span class="n">${typeof v === 'number' ? v.toLocaleString() : v}</span>`;
const sep = () => `<span class="sep">\u2502</span> `;

function findTrieLeaf(node) {
  if (Array.isArray(node)) return node;
  if (node && typeof node === 'object') {
    for (const v of Object.values(node)) {
      const r = findTrieLeaf(v);
      if (r) return r;
    }
  }
  return null;
}

function countTrieNodes(node) {
  if (typeof node === 'string') return {inners:0,leaves:0,placeholders:1};
  if (Array.isArray(node)) return {inners:0,leaves:1,placeholders:0};
  if (node && typeof node === 'object') {
    let s = {inners:1,leaves:0,placeholders:0};
    for (const [k,v] of Object.entries(node)) {
      if (k.length === 1) { const c = countTrieNodes(v); s.inners+=c.inners; s.leaves+=c.leaves; s.placeholders+=c.placeholders; }
    }
    return s;
  }
  return {inners:0,leaves:0,placeholders:0};
}

let linkNum = 0;
const DEBUG_STEP_LINKS = false;
let stepLinksEnabled = false;
const lnk = (cls, hash, label) => {
  const n = Math.floor(linkNum / 2) + 1;
  linkNum++;
  const inverted = n % 2 === 0;
  const badge = `<span class="link-badge${inverted ? ' is-inverted' : ''}" data-link-group="${n}">${n}</span>`;
  const tag = label ? ` \u2192 ${label}` : '';
  return `${badge}<span class="${cls}">${hash}</span>${tag}`;
};

function ensureStepScene() {
  const body = document.getElementById('modal-body');
  let scene = document.getElementById('step-scene');
  let content = document.getElementById('step-content');
  let svg = document.getElementById('step-links');

  debug.style.display = DEBUG_STEP_LINKS ? 'block' : 'none';
  return {body, scene, content, svg, debug};
}

function linkGeometryBetween(fromRect, toRect, overlayRect, pairNum) {
  const ax = fromRect.left - overlayRect.left + (fromRect.width / 2);
  const ay = fromRect.top - overlayRect.top + (fromRect.height / 2);
  const bx = toRect.left - overlayRect.left + (toRect.width / 2);
  const by = toRect.top - overlayRect.top + (toRect.height / 2);
  const dx = bx - ax;
  const dy = by - ay;
  const dist = Math.hypot(dx, dy) || 1;
  const ux = dx / dist;
  const uy = dy / dist;
  const fromRadius = Math.max(4, Math.min(fromRect.width, fromRect.height) / 2 - 1);
  const toRadius = Math.max(4, Math.min(toRect.width, toRect.height) / 2 - 1);
  const sx = ax + ux * fromRadius;
  const sy = ay + uy * fromRadius;
  const ex = bx - ux * toRadius;
  const ey = by - uy * toRadius;
  const px = -uy;
  const py = ux;
  const bend = Math.min(20, Math.max(8, dist * 0.14)) * (pairNum % 2 === 0 ? 1 : -1);
  const c1x = sx + dx * 0.28 + px * bend;
  const c1y = sy + dy * 0.22 + py * bend;
  const c2x = ex - dx * 0.28 + px * bend;
  const c2y = ey - dy * 0.22 + py * bend;
  return {
    centerA: {x: ax, y: ay},
    centerB: {x: bx, y: by},
    start: {x: sx, y: sy},
    end: {x: ex, y: ey},
    path: `M ${sx.toFixed(1)} ${sy.toFixed(1)} C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${ex.toFixed(1)} ${ey.toFixed(1)}`
  };
}

function redrawStepLinks({animate = false} = {}) {
  const scene = document.getElementById('step-scene');
  const content = document.getElementById('step-content');
  const svg = document.getElementById('step-links');
  const debug = document.getElementById('step-links-debug');
  if (!scene || !content || !svg || !debug) return;

  const badges = Array.from(content.querySelectorAll('.link-badge[data-link-group]'));
  const width = Math.ceil(scene.clientWidth || content.clientWidth || 1);
  const height = Math.ceil(scene.clientHeight || content.offsetHeight || 1);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  debug.setAttribute('viewBox', `0 0 ${width} ${height}`);

  if (!stepLinksEnabled || !badges.length) {
    svg.innerHTML = '';
    debug.innerHTML = '';
    return;
  }

  const overlayRect = svg.getBoundingClientRect();
  const groups = new Map();
  for (const badge of badges) {
    const group = badge.dataset.linkGroup;
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(badge);
  }

  const paths = [];
  const debugShapes = DEBUG_STEP_LINKS
    ? [`<rect class="link-debug-box" x="0.5" y="0.5" width="${Math.max(1, width - 1)}" height="${Math.max(1, height - 1)}"/>`]
    : [];
  for (const [group, nodes] of groups.entries()) {
    if (nodes.length < 2) continue;
    nodes.sort((a, b) => {
      const top = a.offsetTop - b.offsetTop;
      return top || (a.offsetLeft - b.offsetLeft);
    });
    for (let i = 0; i + 1 < nodes.length; i += 2) {
      const pairNum = Number(group) || 0;
      const fromRect = nodes[i].getBoundingClientRect();
      const toRect = nodes[i + 1].getBoundingClientRect();
      const geom = linkGeometryBetween(fromRect, toRect, overlayRect, pairNum);
      const classes = `link-path${pairNum % 2 === 0 ? ' even' : ''}${animate ? ' animate-in' : ''}`;
      const delay = animate ? ` style="animation-delay:${Math.min((pairNum - 1) * 55, 330)}ms"` : '';
      paths.push(`<path class="${classes}" d="${geom.path}"${delay}/>`);
      if (DEBUG_STEP_LINKS) {
        const boxes = [fromRect, toRect].map((rect) => {
          const x = rect.left - overlayRect.left;
          const y = rect.top - overlayRect.top;
          return `<rect class="link-debug-box" x="${(x - 2).toFixed(1)}" y="${(y - 2).toFixed(1)}" width="${(rect.width + 4).toFixed(1)}" height="${(rect.height + 4).toFixed(1)}" rx="3"/>`;
        });
        debugShapes.push(...boxes);
        debugShapes.push(`<circle class="link-debug-dot" cx="${geom.centerA.x.toFixed(1)}" cy="${geom.centerA.y.toFixed(1)}" r="2.9"/>`);
        debugShapes.push(`<circle class="link-debug-dot" cx="${geom.centerB.x.toFixed(1)}" cy="${geom.centerB.y.toFixed(1)}" r="2.9"/>`);
        debugShapes.push(`<circle class="link-debug-edge" cx="${geom.start.x.toFixed(1)}" cy="${geom.start.y.toFixed(1)}" r="2.2"/>`);
        debugShapes.push(`<circle class="link-debug-edge" cx="${geom.end.x.toFixed(1)}" cy="${geom.end.y.toFixed(1)}" r="2.2"/>`);
      }
    }
  }

  svg.innerHTML = paths.join('');
  debug.innerHTML = DEBUG_STEP_LINKS ? debugShapes.join('') : '';
}

let stepLinkDrawToken = 0;

function nextAnimationFrame() {
  return new Promise((resolve) => requestAnimationFrame(resolve));
}

function stepLinkLayoutSignature() {
  const content = document.getElementById('step-content');
  const scene = document.getElementById('step-scene');
  if (!content) return '';
  const badges = Array.from(content.querySelectorAll('.link-badge[data-link-group]'));
  return [
    Math.round((scene?.clientHeight || content.offsetHeight) * 2) / 2,
    ...badges.map((badge) => {
      const rect = badge.getBoundingClientRect();
      return [
        badge.dataset.linkGroup || '',
        Math.round(rect.left * 2) / 2,
        Math.round(rect.top * 2) / 2,
        Math.round(rect.width * 2) / 2,
        Math.round(rect.height * 2) / 2
      ].join(':');
    })
  ].join('|');
}

async function queueStepLinkRedraw({animate = false} = {}) {
  const token = ++stepLinkDrawToken;
  const svg = document.getElementById('step-links');
  const debug = document.getElementById('step-links-debug');
  if (svg) svg.innerHTML = '';
  if (debug) debug.innerHTML = '';

  if (!stepLinksEnabled) return;

  let stableFrames = 0;
  let lastSignature = '';

  for (let i = 0; i < 24; i++) {
    await nextAnimationFrame();
    if (token !== stepLinkDrawToken) return;
    const signature = stepLinkLayoutSignature();
    if (signature && signature === lastSignature) {
      stableFrames++;
      if (stableFrames >= 2) break;
    } else {
      stableFrames = 0;
      lastSignature = signature;
    }
  }

  await nextAnimationFrame();
  if (token !== stepLinkDrawToken) return;
  redrawStepLinks({animate});
}

function clearStepScene() {
  stepLinksEnabled = false;
  stepLinkDrawToken++;
  const content = document.getElementById('step-content');
  const svg = document.getElementById('step-links');
  const debug = document.getElementById('step-links-debug');
  if (content) content.innerHTML = '';
  if (svg) svg.innerHTML = '';
  if (debug) debug.innerHTML = '';
}

async function describeStep(step, i, allSteps) {
  const type = step.type || 'unknown';
  const cls = type === 'anchor' ? 'anchor' : type === 'ledger_header' ? 'header' : 'map';
  let lines = [];

  if (type === 'anchor') {
    const nv = Object.keys(step.validations || {}).length;
    // Decode UNL blob to get real validator count
    let unlSize = nv;
    try {
      const blobHex = step.unl?.blob || '';
      if (blobHex) {
        const blobStr = blobHex.match(/.{1,2}/g).map(b => String.fromCharCode(parseInt(b, 16))).join('');
        unlSize = (JSON.parse(blobStr).validators || []).length;
      }
    } catch(e) {}
    lines.push(kv('ledger', `#${num(step.ledger_index)} ${sep()}${lnk('link-anchor', step.ledger_hash.substring(0,24)+'\u2026', 'header')}`));
    lines.push(kv('quorum', `${num(nv)}/${num(unlSize)} UNL validators ${sep()}${hx(step.unl?.public_key || '', 16)}`));
  } else if (type === 'ledger_header') {
    const h = step.header || {};
    const computed = await hashHeader(h);
    const ts = rippleTime(h.close_time);
    // Check if this header was reached via a skip list (preceding map_proof with Hashes)
    let skipInfo = '';
    for (let j = i - 1; j >= 0; j--) {
      if (allSteps[j].type === 'ledger_header') {
        const prevH = allSteps[j].header;
        const skippedLedgers = prevH.ledger_index - h.ledger_index;
        if (skippedLedgers > 0) {
          const skippedSecs = prevH.close_time - h.close_time;
          let timeStr;
          if (skippedSecs >= 86400) timeStr = `${(skippedSecs / 86400).toFixed(1)}d`;
          else if (skippedSecs >= 3600) timeStr = `${(skippedSecs / 3600).toFixed(1)}h`;
          else if (skippedSecs >= 60) timeStr = `${Math.round(skippedSecs / 60)}m`;
          else timeStr = `${skippedSecs}s`;
          skipInfo = ` ${sep()}<span class="h">\u0394 ${skippedLedgers.toLocaleString()} ledgers / ${timeStr}</span>`;
        }
        break;
      }
    }
    lines.push(kv('ledger', `#${num(h.ledger_index)}${skipInfo} ${sep()}${ts} ${sep()}${lnk('link-anchor', computed.substring(0,24)+'\u2026')}`));
    // Find what comes next to label the links
    let nextIsState = false, nextIsTx = false;
    for (let j = i + 1; j < allSteps.length; j++) {
      if (allSteps[j].type === 'map_proof') {
        if (allSteps[j].tree === 'tx') nextIsTx = true;
        else nextIsState = true;
        break;
      }
    }
    if (nextIsTx) {
      lines.push(kv('transaction_hash', lnk('link-tx', (h.transaction_hash||'').substring(0,24)+'\u2026', 'tx tree')));
    }
    if (nextIsState) {
      lines.push(kv('account_hash', lnk('link-state', (h.account_hash||'').substring(0,24)+'\u2026', 'state tree')));
    }
  } else if (type === 'map_proof') {
    const tree = step.tree || '?';
    const trie = step.trie;
    const isTx = tree === 'tx';
    const linkCls = isTx ? 'link-tx' : 'link-state';
    // Find preceding header to show what hash this root must match
    let rootHash = '';
    for (let j = i - 1; j >= 0; j--) {
      if (allSteps[j].type === 'ledger_header') {
        const hdr = allSteps[j].header;
        rootHash = isTx ? hdr.transaction_hash : hdr.account_hash;
        break;
      }
    }
    const treeName = isTx ? 'transactions' : 'account_state';
    lines.push(kv(treeName, rootHash ? lnk(linkCls, rootHash.substring(0,24)+'\u2026') : ''));

    if (trie) {
      const stats = countTrieNodes(trie);
      lines.push(kv('nodes', `${num(stats.inners)} inners ${sep()}${num(stats.leaves)} leaves ${sep()}${num(stats.placeholders)} placeholders`));

      const leaf = findTrieLeaf(trie);
      if (leaf && leaf.length >= 2 && typeof leaf[1] === 'object') {
        const data = leaf[1];
        const sub = [];
        if (data.LedgerEntryType === 'LedgerHashes' && data.Hashes) {
          // Determine range from preceding header
          let prevSeq = 0;
          for (let j = i - 1; j >= 0; j--) {
            if (allSteps[j].type === 'ledger_header') { prevSeq = allSteps[j].header.ledger_index; break; }
          }
          // Short vs long: compare leaf index to known short skip list key
          const leafIndex = leaf[0] || '';
          const isShort = leafIndex.toUpperCase() === SHORT_SKIP_KEY;
          const h = data.Hashes.length;
          let desc;
          if (isShort && prevSeq) {
            desc = `prior ${num(h)} ledgers (#${num(prevSeq - h)} \u2013 #${num(prevSeq - 1)})`;
          } else if (prevSeq) {
            // Long list: each entry is a flag ledger (every 256th)
            desc = `${num(h)} flag ledgers (every 256th)`;
          } else {
            desc = `${num(h)} entries`;
          }
          sub.push(`<span class="k">LedgerEntryType:</span> <span class="v">LedgerHashes</span> <span class="h"># ${desc}</span>`);
        } else if (data.LedgerEntryType) {
          sub.push(kv('LedgerEntryType', `<span class="v">${data.LedgerEntryType}</span>`));
        }
        if (data.Hashes) {
          const hashes = data.Hashes;
          let targetHash = null;
          for (let j = i + 1; j < allSteps.length; j++) {
            if (allSteps[j].type === 'ledger_header') {
              targetHash = await hashHeader(allSteps[j].header);
              break;
            }
          }
          let matchIdx = -1;
          if (targetHash) {
            matchIdx = hashes.findIndex(h => h.toUpperCase() === targetHash);
          }
          let show;
          if (matchIdx >= 0) {
            const matched = lnk('link-anchor', hashes[matchIdx].substring(0,24)+'\u2026', 'header');
            const before = matchIdx;
            const after = hashes.length - matchIdx - 1;
            const parts = [];
            if (before > 0) parts.push(`\u2026${num(before)} before\u2026`);
            parts.push(matched);
            if (after > 0) parts.push(`\u2026${num(after)} after\u2026`);
            show = parts.join(', ');
          } else {
            show = hashes.length <= 3
              ? hashes.map(x => hx(x, 12)).join(', ')
              : `${hx(hashes[0],12)}, \u2026${num(hashes.length - 2)} more\u2026, ${hx(hashes[hashes.length-1],12)}`;
          }
          sub.push(kv('Hashes', `[${show}] (${num(hashes.length)} total)`));
        }
        if (data.tx) {
          const tx = data.tx;
          const txHash = tx.hash || leaf[0] || '';
          if (txHash) sub.push(kv('hash', `<span class="ok-mark">\u2713</span>${hx(txHash, 24)}`));
          if (tx.TransactionType) sub.push(kv('TransactionType', `<span class="v">${tx.TransactionType}</span>`));
          if (tx.Account) sub.push(kv('Account', `<span class="v">${tx.Account}</span>`));
          if (tx.Destination) sub.push(kv('Destination', `<span class="v">${tx.Destination}</span>`));
          if (tx.Amount) {
            let amt;
            if (typeof tx.Amount === 'string') {
              amt = (parseInt(tx.Amount) / 1e6).toFixed(6) + ' XRP';
            } else {
              let cur = tx.Amount.currency;
              if (cur && cur.length === 40) {
                cur = cur.match(/.{1,2}/g).map(b => {
                  const c = parseInt(b, 16); return c > 31 && c < 127 ? String.fromCharCode(c) : '';
                }).join('').replace(/\0+$/, '');
              }
              amt = tx.Amount.value + ' ' + cur;
            }
            sub.push(kv('Amount', `<span class="n">${amt}</span>`));
          }
        }
        if (data.meta?.TransactionResult) {
          sub.push(kv('result', `<span class="v">${data.meta.TransactionResult}</span>`));
        }
        if (sub.length) {
          lines.push(`<div class="leaf-data"><span class="leaf-ellipsis">\u2026</span>${sub.join('<br>')}<span class="leaf-ellipsis">\u2026</span></div>`);
        }
      }
    }
  }

  return `<div class="step-block ${cls}"><div class="step-type ${cls}">${i + 1}. ${type}</div><div class="step-detail">${lines.join('<br>')}</div></div>`;
}

let skTimer = null;
function skeletonStep(n) {
  if (skTimer) clearInterval(skTimer);
  const html = `<div class="step-skeleton" id="sk-next"><div class="sk-label">${n}. \u2026 <span id="sk-elapsed"></span></div><div class="sk-bar"></div><div class="sk-bar"></div><div class="sk-bar"></div></div>`;
  // Start ticking after a microtask (element needs to be in DOM)
  const start = performance.now();
  skTimer = setInterval(() => {
    const el = document.getElementById('sk-elapsed');
    if (!el) { clearInterval(skTimer); skTimer = null; return; }
    const s = ((performance.now() - start) / 1000).toFixed(1);
    el.textContent = `${s}s`;
  }, 100);
  return html;
}

function finishProve(json, hash) {
  lastProvedHash = hash;
  showDetails(json, hash);
  populateGlobe(lastProofPretty);

  const anchor = (json.steps || []).find(s => s.type === 'anchor');
  const seq = anchor ? anchor.ledger_index : 'unknown';
  const netSlug = networkSlugForId(json.network_id) || 'unknown';
  const filename = `proof-${netSlug}-${seq}-${hash.substring(0, 12).toUpperCase()}.xprv.json`;

  const blob = new Blob([lastProofPretty], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  lastDownloadUrl = url;
  lastFilename = filename;

  statusEl.className = 'status done';
  const binFilename = filename.replace('.xprv.json', '.xprv.bin');
  statusEl.innerHTML = `<a class="act act-primary" href="${url}" download="${filename}" title="${filename}">json</a><a class="act" href="/prove?tx=${hash}&format=bin" download="${binFilename}" title="${binFilename}">bin</a><button type="button" class="act" onclick="copyProof()" title="copy JSON">copy</button>`;
}

let activeSSE = null;
let activeProveToken = 0;
let activeProveTimeout = null;
// The backend owns a bounded proof deadline and reports long-running header
// rounds once per second. This is only a last-resort stream watchdog; it must
// not pre-empt the backend's typed terminal result.
const proveInactivityTimeoutMs = 75000;

function cancelActiveProof() {
  activeProveToken++;
  if (activeSSE) {
    activeSSE.close();
    activeSSE = null;
  }
  if (activeProveTimeout) {
    clearTimeout(activeProveTimeout);
    activeProveTimeout = null;
  }
}

function showModalError(msg, hash) {
  const {body, content} = ensureStepScene();
  const sk = document.getElementById('sk-next');
  if (sk) sk.remove();
  stepLinksEnabled = false;
  const title = document.querySelector('#modal-header h3');
  if (title && title.firstChild && title.firstChild.nodeType === Node.TEXT_NODE)
    title.firstChild.textContent = 'Proof failed ';
  const div = document.createElement('div');
  div.className = 'modal-error';
  div.innerHTML = `<span class="msg">${msg}</span><button type="button" class="retry">retry</button>`;
  div.querySelector('button').onclick = () => prove(hash, {history:'none'});
  content.appendChild(div);
  queueStepLinkRedraw();
  body.scrollTop = body.scrollHeight;
}

function genRequestId() {
  const a = crypto.getRandomValues(new Uint8Array(4));
  return Array.from(a, b => b.toString(16).padStart(2,'0')).join('');
}

async function prove(hash, {history = 'push'} = {}) {
  cancelActiveProof();
  const proveToken = activeProveToken;
  stepLinksEnabled = false;

  statusEl.className = 'status working';
  statusEl.textContent = 'proving\u2026';
  details.className = '';

  const rid = genRequestId();
  lastRid = rid;
  fetchServerInfo();

  // Open step modal immediately with skeleton placeholder
  const modal = document.getElementById('modal');
  const {body, content} = ensureStepScene();
  clearStepScene();
  document.getElementById('modal-header').innerHTML = `<h3>Building proof\u2026 ${idBadges(rid)}</h3>`;
  content.innerHTML = skeletonStep(1);
  modal.className = 'show';
  linkNum = 0;
  const streamedSteps = [];
  let stepStartTime = performance.now();
  const stepTimes = [];  // elapsed ms per step

  return new Promise((resolve) => {
    const es = new EventSource(`/prove?tx=${hash}&xrid=${rid}`);
    activeSSE = es;

    let settled = false;  // true once done/error handled
    const armInactivityTimeout = () => {
      if (activeProveTimeout) clearTimeout(activeProveTimeout);
      activeProveTimeout = setTimeout(() => {
        if (proveToken !== activeProveToken) return;
        if (settled) return;
        es.close(); activeSSE = null;
        activeProveTimeout = null;
        settled = true;
        statusEl.className = 'status error';
        statusEl.textContent = 'proof stream stopped responding';
        showModalError('proof stream stopped responding', hash);
        resolve();
      }, proveInactivityTimeoutMs);
    };
    armInactivityTimeout();

    es.onmessage = async (e) => {
      try {
        if (proveToken !== activeProveToken) return;
        armInactivityTimeout();
        const msg = JSON.parse(e.data);

        if (msg.type === 'log') {
          // Rolling log console — max 5 lines, newest at bottom
          let logBox = document.getElementById('log-console');
          if (!logBox) {
            logBox = document.createElement('div');
            logBox.id = 'log-console';
            logBox.className = 'log-console';
            const sk = document.getElementById('sk-next');
            if (sk) sk.parentElement.insertBefore(logBox, sk);
            else content.appendChild(logBox);
          }
          const liveProgressKind = msg.msg.includes('header seq=') &&
            msg.msg.includes('unsettled peer request(s)')
            ? 'header-peer-wait'
            : msg.msg.startsWith('history source selection ledger ')
              ? 'history-source-selection'
              : null;
          let line = liveProgressKind
            ? logBox.querySelector(`[data-live-progress="${liveProgressKind}"]`)
            : null;
          for (const previousLive of logBox.querySelectorAll('[data-live-progress]')) {
            if (previousLive !== line)
              previousLive.removeAttribute('data-live-progress');
          }
          if (!line) {
            line = document.createElement('div');
            line.style.cssText = 'padding:.05rem 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
            logBox.appendChild(line);
          }
          if (liveProgressKind) line.dataset.liveProgress = liveProgressKind;
          line.textContent = '\u203a ' + msg.msg;
          // Cap at 5 lines
          while (logBox.children.length > 5)
            logBox.removeChild(logBox.firstChild);
          logBox.scrollTop = logBox.scrollHeight;
          body.scrollTop = body.scrollHeight;
        }

        if (msg.type === 'step') {
          const now = performance.now();
          const elapsed = now - stepStartTime;
          stepTimes.push(elapsed);
          stepStartTime = now;

          streamedSteps.push(msg.step);
          statusEl.textContent = `proving\u2026 step ${msg.index + 1}`;
          // Remove log console + skeleton for this step
          const lc = document.getElementById('log-console');
          if (lc) lc.remove();
          const sk = document.getElementById('sk-next');
          if (sk) sk.remove();
          // Render step with timing badge
          const html = await describeStep(msg.step, msg.index, streamedSteps);
          if (proveToken !== activeProveToken) return;
          const timeLabel = elapsed < 1000
            ? `${Math.round(elapsed)}ms`
            : `${(elapsed / 1000).toFixed(1)}s`;
          const timed = html.replace(
            '<div class="step-detail">',
            `<span class="step-time">${timeLabel}</span><div class="step-detail">`);
          content.insertAdjacentHTML('beforeend', timed);
          // Add next skeleton (unless this was a tx map_proof = final step)
          const isFinal = msg.step.type === 'map_proof' && msg.step.tree === 'tx';
          if (!isFinal) {
            content.insertAdjacentHTML('beforeend', skeletonStep(msg.index + 2));
          }
          // Auto-scroll to bottom
          body.scrollTop = body.scrollHeight;
        }

        if (msg.type === 'done') {
          settled = true;
          if (activeProveTimeout) {
            clearTimeout(activeProveTimeout);
            activeProveTimeout = null;
          }
          if (skTimer) { clearInterval(skTimer); skTimer = null; }
          es.close(); activeSSE = null;
          // Assemble proof from streamed steps
          const json = {
            network_id: msg.network_id || 0,
            steps: streamedSteps
          };
          finishProve(json, hash);
          // Always update URL to match actual network (e.g. deep link
          // said xahau but tx was found on xrpl). Use 'replace' for
          // initial page load so we don't pollute browser history.
          syncProofPath(hash, json.network_id,
            history === 'none' ? 'replace' : history);
          // Re-render all steps with full context for correct links
          showSteps();
          resolve();
        }

        if (msg.type === 'error') {
          settled = true;
          if (activeProveTimeout) {
            clearTimeout(activeProveTimeout);
            activeProveTimeout = null;
          }
          es.close(); activeSSE = null;
          statusEl.className = 'status error';
          statusEl.textContent = msg.error;
          showModalError(msg.error, hash);
          resolve();
        }
      } catch(err) {
        // JSON parse error — ignore malformed event
      }
    };

    es.onerror = () => {
      if (proveToken !== activeProveToken) return;
      if (settled) return;  // error/done already handled
      if (activeProveTimeout) {
        clearTimeout(activeProveTimeout);
        activeProveTimeout = null;
      }
      es.close(); activeSSE = null;
      const errMsg = streamedSteps.length ? 'connection lost' : 'failed to connect';
      statusEl.className = 'status error';
      statusEl.textContent = errMsg;
      showModalError(errMsg, hash);
      resolve();
    };
  });
}

function applyRouteFromLocation() {
  const route = parseProofPath();
  if (!route) {
    if (tx.value) {
      tx.value = '';
      handleTxInput({history:'none'});
    }
    return;
  }
  if (tx.value !== route.txHash)
    tx.value = route.txHash;
  handleTxInput({history:'none'});
}

window.addEventListener('popstate', applyRouteFromLocation);
window.addEventListener('resize', () => queueStepLinkRedraw());
applyRouteFromLocation();
</script>
</body>
</html>
