name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # Use Ubuntu 24.04 which has GCC 14 by default
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        generator: [Ninja, Makefiles]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            version: 13
          - compiler: clang
            cc: clang-16
            cxx: clang++-16
            version: 16
    env:
      build_dir: build
      CACHE_VERSION: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          
          # GCC 14 is already available on Ubuntu 24.04
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y build-essential libstdc++-14-dev
          fi
          
          # For Clang, install with libc++ support
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang-16 libc++-dev libc++abi-dev
          fi

          # Log clang and gcc versions
          echo "Running ${{ matrix.cc }} --version"
          ${{ matrix.cc }} --version
          echo "Running ${{ matrix.cxx }} --version"
          ${{ matrix.cxx }} --version

          # Install specific Conan version needed
          pip install --upgrade conan

      - name: Verify compiler versions
        run: |
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version

      - name: Restore Conan cache
        id: cache-restore-conan
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.conan2
          key: ${{ runner.os }}-conan-${{env.CACHE_VERSION}}=${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('**/conanfile.txt', '**/conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-${{env.CACHE_VERSION}}-${{ matrix.compiler }}-${{ matrix.build_type }}-

      - name: Configure Conan
        run: |
          conan profile detect --name detected --force
          mkdir -p "$(conan config home)/profiles"
          cat >$(conan config home)/profiles/default <<EOF
          include(detected)
          [settings]
          compiler.cppstd=20
          compiler.libcxx=libstdc++
          build_type=${{ matrix.build_type }}
          [conf]
          tools.build:compiler_executables={"c": "/usr/bin/${{ matrix.cc }}", "cpp": "/usr/bin/${{ matrix.cxx }}"}
          EOF
          echo "Detected conan profile:"
          conan profile show -pr detected
          echo "Default conan profile:"
          conan profile show -pr default

      - name: Export local recipes
        run: |
          conan export external/ftxui/all --name=ftxui --version=6.1.9 --user=catalogue-tools --channel=stable
          conan export external/libsecp256k1/all --name=libsecp256k1 --version=0.6.0 --user=catalogue-tools --channel=stable

      - name: Install dependencies
        id: conan-install
        run: |
          mkdir -p ${{ env.build_dir }}
          cd ${{ env.build_dir }}
          conan install \
            --output-folder . \
            --build missing \
            --settings build_type=${{ matrix.build_type }} \
            ..
        continue-on-error: true

      - name: Save Conan cache
        if: steps.cache-restore-conan.outputs.cache-hit != 'true' && steps.conan-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.conan2
          key: ${{ runner.os }}-conan-${{env.CACHE_VERSION}}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('**/conanfile.txt', '**/conanfile.py') }}

      - name: Configure CMake
        run: |
          cd ${{ env.build_dir }}
          if [ "${{ matrix.generator }}" = "Ninja" ]; then
            cmake -G "Ninja" \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_C_COMPILER=/usr/bin/${{ matrix.cc }} \
              -DCMAKE_CXX_COMPILER=/usr/bin/${{ matrix.cxx }} \
              -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake \
              ..
          else
            cmake -G "Unix Makefiles" \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_C_COMPILER=/usr/bin/${{ matrix.cc }} \
              -DCMAKE_CXX_COMPILER=/usr/bin/${{ matrix.cxx }} \
              -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake \
              ..
          fi

      - name: Build
        run: |
          cd ${{ env.build_dir }}
          if [ "${{ matrix.generator }}" = "Ninja" ]; then
            ninja
          else
            make -j$(nproc)
          fi

      - name: Run tests
        run: |
          cd ${{ env.build_dir }}
          ctest --verbose

      # Live end-to-end xprv exercise on ONE compiler only: boot `xprv serve`
      # and prove + verify real (recently-fetched) transactions against live
      # network peers, including a flag-ledger target (era-direct skip path) in
      # both JSON and binary form. Non-gating (continue-on-error) because it
      # depends on live mainnet peer availability; flip to false to require it.
      - name: Live xprv prove/verify smoke
        # !cancelled() so an unrelated earlier failure (e.g. a flaky ctest)
        # doesn't silently skip this — it exercises the built binary, not ctest.
        if: ${{ !cancelled() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' && matrix.generator == 'Ninja' }}
        continue-on-error: true
        run: |
          XPRV_BIN=${{ env.build_dir }}/src/xprv/xprv bash scripts/ci-xprv-live-smoke.sh

  # ── Sanitizers ────────────────────────────────────────────────────────
  # Build the SHAMap/xprv test binaries with TSan and ASan (one compiler,
  # two separate builds — the sanitizers are mutually exclusive) and run the
  # CoW concurrency stress test plus the full suites under each. Gating:
  # a data race or memory error here is a real bug, and TSan flags the
  # unsynchronized-access pattern deterministically (not by timing luck).
  sanitizers:
    name: sanitizers (${{ matrix.san }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        san: [thread, address]
    env:
      build_dir: build-san
      CACHE_VERSION: 7
      cc: clang-16
      cxx: clang++-16
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-16 build-essential libstdc++-14-dev
          pip install --upgrade conan

      - name: Restore Conan cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.conan2
          key: ${{ runner.os }}-conan-${{ env.CACHE_VERSION }}-clang-Release-${{ hashFiles('**/conanfile.txt', '**/conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-${{ env.CACHE_VERSION }}-clang-Release-

      - name: Configure Conan
        run: |
          conan profile detect --name detected --force
          mkdir -p "$(conan config home)/profiles"
          cat >$(conan config home)/profiles/default <<EOF
          include(detected)
          [settings]
          compiler.cppstd=20
          compiler.libcxx=libstdc++
          build_type=Release
          [conf]
          tools.build:compiler_executables={"c": "/usr/bin/${{ env.cc }}", "cpp": "/usr/bin/${{ env.cxx }}"}
          EOF

      - name: Export local recipes
        run: |
          conan export external/ftxui/all --name=ftxui --version=6.1.9 --user=catalogue-tools --channel=stable
          conan export external/libsecp256k1/all --name=libsecp256k1 --version=0.6.0 --user=catalogue-tools --channel=stable

      - name: Install dependencies
        run: |
          mkdir -p ${{ env.build_dir }}
          cd ${{ env.build_dir }}
          conan install --output-folder . --build missing --settings build_type=Release ..

      - name: Configure CMake (CATL_SANITIZE=${{ matrix.san }})
        run: |
          cd ${{ env.build_dir }}
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/${{ env.cc }} \
            -DCMAKE_CXX_COMPILER=/usr/bin/${{ env.cxx }} \
            -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake \
            -DCATL_SANITIZE=${{ matrix.san }} \
            ..

      - name: Build instrumented test binaries
        run: cmake --build ${{ env.build_dir }} --target shamap_gtest xprv_gtest -j"$(nproc)"

      - name: Run tests under ${{ matrix.san }} sanitizer
        run: |
          shamap=${{ env.build_dir }}/tests/shamap/shamap_gtest
          xprv=${{ env.build_dir }}/tests/xprv/xprv_gtest
          if [ "${{ matrix.san }}" = "thread" ]; then
            export TSAN_OPTIONS="halt_on_error=1"
          else
            export ASAN_OPTIONS="detect_leaks=0:halt_on_error=1"
          fi
          # CoW concurrency stress test is the key race guard — repeat it hard.
          "$shamap" --gtest_filter=ShaMapCoWConcurrency.StressTest \
            --gtest_repeat=100 --gtest_break_on_failure --gtest_brief=1
          # Full SHAMap + xprv suites under the sanitizer.
          "$shamap" --gtest_brief=1
          "$xprv" --gtest_brief=1

